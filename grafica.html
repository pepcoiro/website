<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grafica / Giuseppe Coiro</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js"></script>
</head>

<body>
  <site-header></site-header>

  <main class="contenuto">
    <h2>Portfolio</h2>

    <nav class="filtri-grafica" aria-label="Filtra per evento">
      <button class="filtro-grafica attivo" data-filtro="tutti">Tutti</button>
      <button class="filtro-grafica" data-filtro="casa-sanremo">Casa Sanremo</button>
      <button class="filtro-grafica" data-filtro="cartoons">Cartoons on the Bay</button>
      <button class="filtro-grafica" data-filtro="cineteatro">Cineteatro Ferrari</button>
      <button class="filtro-grafica" data-filtro="gruppo-eventi">Gruppo Eventi</button>
      <button class="filtro-grafica" data-filtro="varie">Varie</button>
    </nav>


    <div class="galleria">
      <!-- Casa Sanremo -->
      <img src="grafiche/Banner scuole - Livebox 2027_social.jpg" alt="Banner scuole Livebox 2027"
        data-evento="casa-sanremo">

      <img src="grafiche/Casa Sanremo 2027 - Giorni_150.jpg" alt="Casa Sanremo 2027 — Giorni"
        data-evento="casa-sanremo">

      <img src="grafiche/Casa Sanremo 2027_copertina.jpg" alt="Casa Sanremo 2027 — Copertina"
        data-evento="casa-sanremo">

      <img src="grafiche/Casa Sanremo App_Scarica.jpg" alt="Casa Sanremo App — Scarica" data-evento="casa-sanremo">

      <img src="grafiche/Casa Sanremo Campus 2027_social.jpg" alt="Casa Sanremo Campus 2027" data-evento="casa-sanremo">

      <img src="grafiche/Richiesta Pass Aperta - Casa Sanremo 2027_social.jpg"
        alt="Richiesta pass aperta — Casa Sanremo 2027" data-evento="casa-sanremo">

      <img src="grafiche/Sanremo Casa 2026_social.jpg" alt="Casa Sanremo 2026" data-evento="varie">

      <img src="grafiche/Writerx x ASI_social.jpg" alt="Writerx x ASI" data-evento="casa-sanremo">


      <!-- Cartoons on the Bay -->
      <img src="grafiche/Cartoons_on_the_Bay_2026_1 giugno arte.jpg" alt="Cartoons on the Bay — Arte"
        data-evento="cartoons">

      <img src="grafiche/Cartoons_on_the_Bay_2026_1 giugno cucina.jpg" alt="Cartoons on the Bay — Cucina"
        data-evento="cartoons">

      <img src="grafiche/Cartoons_on_the_Bay_2026_1 giugno livebox.jpg" alt="Cartoons on the Bay — Livebox"
        data-evento="cartoons">

      <img src="grafiche/Cartoons_on_the_Bay_2026_1 giugno.jpg" alt="Cartoons on the Bay — Giugno 2026"
        data-evento="cartoons">


      <!-- Cineteatro Ferrari -->
      <img src="grafiche/Film - Cineteatro Ferrari - Social.png" alt="Film — Cineteatro Ferrari"
        data-evento="cineteatro">

      <img src="grafiche/Inaugurazione - Cineteatro Ferrari_Social copia.jpg" alt="Inaugurazione — Cineteatro Ferrari"
        data-evento="cineteatro">


      <!-- Gruppo Eventi -->
      <img src="grafiche/Ferragosto 2026_gruppo eventi.jpg" alt="Ferragosto 2026 — Gruppo Eventi"
        data-evento="gruppo-eventi">

      <img src="grafiche/Tanti auguri Gruppo Eventi_social.jpg" alt="Auguri — Gruppo Eventi"
        data-evento="gruppo-eventi">


      <!-- Altri progetti -->
      <img src="grafiche/Cilento_Etno_Festival-2025_NOA.jpg" alt="Cilento Etno Festival 2025 — NOA" data-evento="varie">

      <img src="grafiche/Dedicato_a_Te_2026_collella.jpg" alt="Dedicato a Te 2026" data-evento="varie">

      <img src="grafiche/Note di Natale_vallo della lucania copia.jpg" alt="Note di Natale — Vallo della Lucania"
        data-evento="varie">

      <img src="grafiche/Premio Bertoli - A Muso Duro_social.jpg" alt="Premio Bertoli — A Muso Duro"
        data-evento="varie">
    </div>

  </main>

  <site-footer></site-footer>
</body>

</html>
