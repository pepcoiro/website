name: Generate article pages

on:
  push:
    branches:
      - main
    paths:
      - 'articoli/*.md'
      - 'articoli/template.html'
      - 'build_articles.py'
      - '.github/workflows/generate-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate HTML pages
        run: python3 build_articles.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articoli/*.html
          if ! git diff --cached --quiet; then
            git commit -m "Generate article pages and social metadata"
            git push
          else
            echo "No generated pages changed."
          fi
